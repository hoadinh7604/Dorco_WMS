/* core/css/tokens.css — biến giao diện (phương án C · Editorial).

:root{
  /* màu nền & chữ */
  --c-paper:#faf7f2;      /* nền trang */

  --c-line:#e8dfd2;       /* đường kẻ */
  --c-ink:#2a2420;        /* chữ */
  --c-muted:#7b6f66;      /* chữ phụ */

  /* nhãn hệ thống */
  --c-sap:#2b5f8a; --c-wms:#6a4a85; --c-pda:#2f6f6a; --c-manual:#7b6f66;
  /* nhãn nhà máy */

  /* màu các quy trình (chữ trắng trên nền đạt tương phản ≥ 4.5:1) */

  --pf-indigo:#474d8a; --pf-purple:#664784; --pf-cyan:#2a667a; --pf-slate:#525963;

  /* chữ */
  --f-body:'Be Vietnam Pro',system-ui,'Segoe UI',sans-serif;
  --f-head:'Source Serif 4',Georgia,'Times New Roman',serif;
  --f-body-ko:'Be Vietnam Pro','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  --f-head-ko:'Source Serif 4','Malgun Gothic','Apple SD Gothic Neo','Noto Serif KR',serif;
  --fs-xs:12px; --fs-sm:13px; --fs-body:15px; --fs-lg:19px; --fs-xl:24px; --fs-2xl:34px;

  /* hình khối */

  --shadow:0 1px 0 #eadfd0,0 8px 24px rgba(80,50,30,.06);
  --side-w:264px; --top-h:58px;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--c-paper);color:var(--c-ink);font-family:var(--f-body);font-size:var(--fs-body);line-height:1.6}
:lang(ko) body,html[lang=ko] body{font-family:var(--f-body-ko);word-break:keep-all}
h1,h2,h3,h4{font-family:var(--f-head);font-weight:700;line-height:1.2;margin:0;color:var(--c-ink)}
:lang(ko) h1,:lang(ko) h2,:lang(ko) h3,:lang(ko) h4{font-family:var(--f-head-ko)}
p{margin:0}
a{color:var(--c-accent)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--c-accent);outline-offset:2px}
mark{background:var(--c-mark);color:inherit;border-radius:2px;padding:0 1px}
.app-icon{width:30px;height:30px;flex:none}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

</style>
<style>
/* core/css/layout.css — menu trái, thanh trên, vùng nội dung. */
#app{display:flex;min-height:100vh}
.app-side{position:fixed;inset:0 auto 0 0;width:var(--side-w);display:flex;flex-direction:column;border-right:1px solid var(--c-line);background:var(--c-paper);z-index:20}
.app-brand{padding:28px 22px 22px;display:flex;flex-direction:column;gap:4px}
.app-brand-eyebrow{font-size:var(--fs-sm);font-weight:600;color:var(--c-accent)}
.app-brand-name{font-family:var(--f-head);font-size:27px;line-height:1.15}
.app-brand-tag{font-size:var(--fs-sm);color:var(--c-muted)}
#app-nav{flex:1;overflow-y:auto;padding:6px 14px 20px}
.app-nav-h{font-size:var(--fs-xs);color:var(--c-muted);margin:6px 10px 8px}
.app-nav-link{display:flex;gap:10px;align-items:baseline;padding:9px 14px;border-radius:var(--r-chip);color:#4f453e;text-decoration:none;font-size:14px;line-height:1.35}
.app-nav-link:hover{background:var(--c-soft)}
.app-nav-link.is-on{background:var(--c-ink);color:var(--c-paper)}
.app-nav-num{font-size:var(--fs-xs);font-variant-numeric:tabular-nums;opacity:.65;min-width:18px}
.app-nav-sub{display:block;margin-left:42px;padding:5px 10px;font-size:var(--fs-sm);color:var(--c-muted);text-decoration:none;border-left:2px solid transparent}
.app-nav-sub:hover{color:var(--c-ink)}
.app-nav-sub.is-on{color:var(--c-accent);border-left-color:var(--c-accent);font-weight:600}
.app-foot{padding:14px 22px;border-top:1px solid var(--c-line);font-size:var(--fs-xs);color:var(--c-muted)}
.app-main{margin-left:var(--side-w);flex:1;min-width:0}
.app-top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;min-height:var(--top-h);padding:10px 28px;background:rgba(250,247,242,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--c-line)}
.app-crumb{flex:1;min-width:0;font-size:var(--fs-sm);color:var(--c-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app-crumb b{color:var(--c-ink);font-weight:600}
.app-crumb-sep{margin:0 8px}
.app-content{padding:30px 28px 64px}
.app-page-hd{margin-bottom:26px}
.app-page-eyebrow{font-size:var(--fs-sm);font-weight:600;color:var(--c-accent);margin-bottom:6px}
.app-page-hd h1{font-size:var(--fs-2xl);letter-spacing:-.01em}
.app-page-intro{margin-top:10px;color:var(--c-muted);font-size:var(--fs-body);line-height:1.7}

</style>
<style>
/* core/css/components.css — thành phần dùng chung cho mọi khối. */
.app-btn{border:1px solid var(--c-line);background:var(--c-card);border-radius:var(--r-chip);padding:7px 15px;font-size:var(--fs-sm);cursor:pointer}
.app-btn:hover:not(:disabled){border-color:var(--c-muted)}
.app-btn:disabled{opacity:.4;cursor:default}
.app-langs{display:flex;background:var(--c-soft);border-radius:var(--r-chip);padding:3px}
.app-langs button{border:0;background:transparent;border-radius:var(--r-chip);padding:5px 12px;font-size:var(--fs-sm);cursor:pointer;color:#5a4f47}
.app-langs button.is-on{background:var(--c-card);color:var(--c-ink);font-weight:600;box-shadow:0 1px 2px rgba(80,50,30,.12)}
.app-error{background:var(--c-error-bg);color:var(--c-error);border-radius:var(--r-card);padding:14px 18px;font-size:14px;max-width:860px}

/* thẻ & bảng */
.app-card{background:var(--c-card);border-radius:var(--r-card);box-shadow:var(--shadow)}
.app-table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px;background:var(--c-card);border-radius:var(--r-card);overflow:hidden;box-shadow:var(--shadow)}
.app-table th{text-align:left;font-size:var(--fs-sm);font-weight:600;color:var(--c-muted);background:var(--c-soft);padding:10px 14px;vertical-align:bottom}
.app-table td{padding:10px 14px;border-top:1px solid #f0e8dc;vertical-align:top}

/* bộ lọc */
.app-filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:20px;max-width:1240px}
.app-search{flex:1 1 420px;min-width:280px;border:1px solid var(--c-line);background:var(--c-card);border-radius:var(--r-chip);padding:9px 16px;font-size:14px}
.app-chip{border:1px solid var(--c-line);background:var(--c-card);border-radius:var(--r-chip);padding:6px 14px;font-size:var(--fs-sm);cursor:pointer;color:#5a4f47}
.app-chip.is-on{background:var(--c-ink);border-color:var(--c-ink);color:var(--c-paper)}
.app-empty{padding:28px;text-align:center;color:var(--c-muted);background:var(--c-card);border-radius:var(--r-card);max-width:1240px}

/* nhãn */
.app-sys{display:inline-block;font-size:11px;font-weight:600;padding:1px 9px;border-radius:var(--r-chip);background:var(--c-card);border:1px solid currentColor;white-space:nowrap}
.app-sys[data-sys=SAP]{color:var(--c-sap)} .app-sys[data-sys=WMS]{color:var(--c-wms)} .app-sys[data-sys=PDA]{color:var(--c-pda)}
.app-sys[data-sys=MANUAL],.app-sys:not([data-sys]){color:var(--c-manual)}
.app-plant{display:inline-block;font-size:11px;font-weight:600;color:#fff;border-radius:4px;padding:0 6px;margin-right:4px;background:var(--c-plant-1)}
.app-plant[data-i="1"]{background:var(--c-plant-2)}
.app-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:22px;max-width:1240px}
.app-kpi{background:var(--c-card);border-radius:var(--r-card);box-shadow:var(--shadow);padding:16px 18px}
.app-kpi b{display:block;font-family:var(--f-head);font-size:32px;line-height:1.1}
.app-kpi span{font-size:var(--fs-sm);color:var(--c-muted)}

</style>
<style>
/* core/css/blocks/process-flow.css — sơ đồ quy trình (phương án C). */
.pf-toolbar{display:flex;align-items:center;gap:12px;margin-bottom:14px;font-size:var(--fs-sm);color:var(--c-muted)}
.pf-scroll{overflow-x:auto;padding-bottom:8px}
.pf-sheet{min-width:1640px;max-width:1880px}
.pf-head{margin:0 0 22px}
.pf-head h2{font-size:28px}
.pf-head p{color:var(--c-muted);margin-top:4px}

/* quy trình */
.pf-lane{background:var(--c-card);border-radius:var(--r-lane);box-shadow:var(--shadow);padding:18px 20px 20px;margin-bottom:18px;border-left:6px solid var(--pf-c)}
.pf-lane-hd{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.pf-lane-num{flex:none;min-width:36px;height:36px;padding:0 8px;border-radius:var(--r-chip);background:var(--pf-c);color:#fff;display:grid;place-items:center;font-weight:600;font-size:16px}
.pf-lane-hd h3{font-size:21px}
.pf-lane-hd p{font-size:var(--fs-sm);color:var(--c-muted)}
.pf-body{display:flex;gap:0;align-items:stretch}
.pf-body.pf-stack{flex-direction:column;gap:16px}
.pf-row>.pf-group{flex:var(--pf-w,1) 1 0}
.pf-group{min-width:0}
.pf-group.pf-labeled{border:1.6px dashed var(--pf-g);border-radius:var(--r-card);padding:10px 10px 10px;position:relative}
.pf-group-label{font-size:var(--fs-sm);font-weight:600;color:var(--pf-g);margin:0 0 8px 4px}
.pf-steps{display:flex;align-items:stretch}

/* bước */
.pf-step{flex:1 1 0;min-width:0;background:var(--c-soft);border-radius:var(--r-card);padding:12px 12px 14px;display:flex;flex-direction:column}
.pf-step.pf-wide{flex-grow:1.7}
.pf-step.pf-optional{background:var(--c-card);border:1.6px dashed var(--pf-g)}
.pf-step-hd{display:flex;gap:8px;align-items:flex-start;min-height:38px}
.pf-num{flex:none;width:24px;height:24px;border-radius:50%;background:var(--pf-g,var(--pf-c));color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600;margin-top:1px}
.pf-step h4{font-size:15px;color:var(--c-ink)}
.pf-meta{display:flex;align-items:center;gap:8px;margin:6px 0 8px;color:var(--pf-g,var(--pf-c))}
.pf-meta .app-icon{width:28px;height:28px}
.pf-sys{display:flex;flex-wrap:wrap;gap:4px}
.pf-step ul{margin:0;padding-left:16px;font-size:13px;line-height:1.5;color:#4f453e}
.pf-step li{margin:2px 0}
.pf-step li.pf-sync{list-style:none;margin-left:-16px;color:var(--c-sync);font-weight:600}
.pf-step li.pf-sync::before{content:"⇄ "}
.pf-case{margin-top:8px;background:var(--c-card);border-radius:8px;padding:6px 9px;font-size:12.5px;line-height:1.45}
.pf-case b{display:inline-block;min-width:20px;text-align:center;font-size:11px;color:#fff;background:var(--pf-c);border-radius:4px;padding:0 5px;margin-right:2px}
.pf-case[data-tag=A] b{background:#9a531c} .pf-case[data-tag=B] b{background:#2f6a65}
.pf-alert{display:block;color:var(--pf-red);font-weight:600;margin-top:2px}

/* mũi tên */
.pf-arrow{flex:0 0 26px;align-self:center;height:12px;position:relative;color:var(--pf-a,var(--pf-g,var(--pf-c)))}
.pf-arrow::before{content:"";position:absolute;left:4px;right:8px;top:5px;border-top:2px solid currentColor}
.pf-arrow::after{content:"";position:absolute;right:2px;top:1px;border-left:8px solid currentColor;border-top:5px solid transparent;border-bottom:5px solid transparent}
.pf-arrow-dashed::before{border-top-style:dashed}
.pf-row>.pf-arrow{flex-basis:34px}
.pf-row>.pf-group+.pf-group{margin-left:18px}
.pf-row>.pf-arrow+.pf-group{margin-left:0}
.pf-note{margin-top:10px;font-size:var(--fs-sm);font-style:italic;color:var(--c-muted)}

/* 3 khung cuối */
.pf-panels{display:grid;grid-template-columns:1.3fr 1.2fr 1fr;gap:16px;margin-top:6px}

<script>
/* core/js/util.js — tiện ích dùng chung (không phụ thuộc file khác). */
(function (App) {
  'use strict';
  var ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ESC[c]; });
  }

  /* Bỏ dấu một ký tự (giữ độ dài 1 → 0..n ký tự), không gộp khoảng trắng. */
  function foldChar(c) {
    return c.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase();
  }

  /* Chuẩn hoá để tìm kiếm: bỏ dấu, đ→d, chữ thường, gộp khoảng trắng. */
  function norm(s) {
    return foldChar(String(s == null ? '' : s)).replace(/\s+/g, ' ').trim();
  }

  /* Tô sáng phần khớp q (q đã norm) trong text; trả HTML đã escape. */
  function highlight(text, q) {
    text = String(text == null ? '' : text);
    if (!q) return esc(text);
    var folded = '', map = [];
    for (var i = 0; i < text.length; i++) {
      var f = foldChar(text[i]);
      for (var k = 0; k < f.length; k++) { folded += f[k]; map.push(i); }
    }
    var at = folded.indexOf(q);
    if (at < 0) return esc(text);
    var start = map[at], end = map[at + q.length - 1] + 1;
    return esc(text.slice(0, start)) + '<mark>' + esc(text.slice(start, end)) + '</mark>' + esc(text.slice(end));
  }

  /* Gộp mọi ngôn ngữ của một chữ (chuỗi thường hoặc { vi, en, ko, ... }) để tìm kiếm. */
  function textAll(x) {
    if (x == null) return '';
    if (typeof x !== 'object') return String(x);
    return Object.keys(x).map(function (k) { return x[k]; }).join(' ');
  }

  App.util = { esc: esc, norm: norm, highlight: highlight, textAll: textAll };
})(window.App = window.App || {});

</script>
<script>
/* core/js/i18n.js — ngôn ngữ, bản dịch, chữ giao diện. */
(function (App) {
  'use strict';
  var KEY = 'wms-lang';
  var current = 'vi', codes = ['vi'], fallback = 'vi';
  App._strings = App._strings || {};
  App.missing = [];

  function store(get, val) {
    try {
      if (get) return window.localStorage.getItem(KEY);
      window.localStorage.setItem(KEY, val);
    } catch (e) { /* localStorage bị chặn: bỏ qua */ }
    return null;
  }

  App.strings = function (lang, obj) {
    var t = App._strings[lang] = App._strings[lang] || {};
    for (var k in obj) t[k] = obj[k];
  };

  App.t = function (x) {
    if (x == null) return '';
    if (typeof x !== 'object') return String(x);
    if (x[current] != null) return x[current];
    if (x[fallback] != null) {
      App.missing.push({ lang: current, sample: x[fallback] });
      return x[fallback];
    }
    App.missing.push({ lang: current, sample: JSON.stringify(x) });
    return '';
  };

  App.ui = function (key) {
    var s = App._strings[current], f = App._strings[fallback];
    if (s && s[key] != null) return s[key];
    if (f && f[key] != null) return f[key];
    return key;
  };

  App.lang = function () { return current; };

  App.setLang = function (code) {
    if (codes.indexOf(code) < 0) code = fallback;
    current = code;
    store(false, code);
    document.documentElement.lang = code;
    document.dispatchEvent(new CustomEvent('app:lang', { detail: code }));
  };

  App.initLang = function (config) {
    codes = (config.languages || [{ code: 'vi' }]).map(function (l) { return l.code; });
    fallback = config.defaultLanguage || codes[0];
    var fromUrl = null;
    try { fromUrl = new URLSearchParams(location.search).get('lang'); } catch (e) {}
    var pick = [fromUrl, store(true), fallback].filter(function (c) { return c && codes.indexOf(c) >= 0; })[0];
    current = pick || fallback;
    document.documentElement.lang = current;
  };
})(window.App = window.App || {});

</script>

<script>
/* core/js/app.js — sổ đăng ký, khung trang, điều hướng #hash, xử lý lỗi.
 *
 * Các file khác chỉ gọi:
 *   App.config({...})            cấu hình dự án (content/config.js)
 *   App.data('ten', {...})       dữ liệu một mục (content/data/*.js)
 *   App.strings('vi', {...})     chữ giao diện (content/i18n/*.js)
 *   App.block('loai', {render, mount})   khối hiển thị (core/js/blocks/*.js)
 * rồi index.html gọi App.start().
 */
(function (App) {
  'use strict';
  var u = App.util;
  App._config = null;
  App._data = {};
  App._blocks = {};

  App.config = function (obj) { App._config = obj; };
  App.data = function (name, obj) {
    if (arguments.length < 2) return App._data[name];
    App._data[name] = obj;
  };
  App.block = function (type, def) { App._blocks[type] = def; };

  function fill(tpl, vars) {
    return String(tpl).replace(/\{(\w+)\}/g, function (m, k) { return vars[k] != null ? vars[k] : m; });
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function sections() { return (App._config && App._config.sections) || []; }

  function parseHash() {
    var raw = (location.hash || '').replace(/^#/, ''), h;
    try { h = decodeURIComponent(raw); } catch (e) { h = raw; }   // hash hỏng (vd '#%') → dùng nguyên văn
    var parts = h.split('--');
    var list = sections();
    var sec = list.filter(function (s) { return s.id === parts[0]; })[0] || list[0];
    var sub = sec && sec.id === parts[0] ? (parts[1] || '') : '';
    return { section: sec, sub: sub };
  }

  App.go = function (hash) {
    if (location.hash === hash) render(); else location.hash = hash;
  };

  /* ---------- khung trang ---------- */
  function shell() {
    var c = App._config, p = c.project || {};
    var nav = sections().map(function (s, i) {
      var subs = (s.subs || []).map(function (sb) {
        return '<a class="app-nav-sub" href="#' + u.esc(s.id) + '--' + u.esc(sb.id) + '" data-sub="' + u.esc(sb.id) +
          '" data-parent="' + u.esc(s.id) + '">' + u.esc(App.t(sb.title)) + '</a>';
      }).join('');
      return '<a class="app-nav-link" href="#' + u.esc(s.id) + '" data-section="' + u.esc(s.id) + '">' +
        '<span class="app-nav-num">' + pad(i + 1) + '</span><span>' + u.esc(App.t(s.title)) + '</span></a>' + subs;
    }).join('');
    var langs = (c.languages || []).map(function (l) {
      return '<button type="button" data-lang="' + u.esc(l.code) + '">' + u.esc(l.label || l.code) + '</button>';
    }).join('');
    document.getElementById('app').innerHTML =
      '<aside class="app-side">' +
        '<div class="app-brand">' +
          (p.eyebrow ? '<span class="app-brand-eyebrow">' + u.esc(App.t(p.eyebrow)) + '</span>' : '') +
          '<strong class="app-brand-name">' + u.esc(App.t(p.name)) + '</strong>' +
          (p.tagline ? '<span class="app-brand-tag">' + u.esc(App.t(p.tagline)) + '</span>' : '') +
        '</div>' +
        '<nav id="app-nav" aria-label="' + u.esc(App.ui('nav_contents')) + '">' +
          '<p class="app-nav-h">' + u.esc(App.ui('nav_contents')) + '</p>' + nav + '</nav>' +
        (p.footer ? '<p class="app-foot">' + u.esc(App.t(p.footer)) + '</p>' : '') +
      '</aside>' +
      '<div class="app-main">' +
        '<header class="app-top">' +
          '<div id="app-crumb" class="app-crumb"></div>' +
          (langs ? '<div id="app-langs" class="app-langs" role="group">' + langs + '</div>' : '') +
          '<button type="button" id="app-prev" class="app-btn">' + u.esc(App.ui('prev')) + '</button>' +
          '<button type="button" id="app-next" class="app-btn">' + u.esc(App.ui('next')) + '</button>' +
          '<button type="button" id="app-print" class="app-btn">' + u.esc(App.ui('print')) + '</button>' +
        '</header>' +
        '<main id="app-content" class="app-content"></main>' +
      '</div>';

    var langsEl = document.getElementById('app-langs');
    if (langsEl) langsEl.addEventListener('click', function (e) {
      var b = e.target.closest('button[data-lang]');
      if (b) App.setLang(b.getAttribute('data-lang'));
    });
    document.getElementById('app-prev').addEventListener('click', function () { step(-1); });
    document.getElementById('app-next').addEventListener('click', function () { step(1); });
    document.getElementById('app-print').addEventListener('click', function () { window.print(); });
  }

  function step(d) {
    var list = sections(), cur = parseHash().section, i = list.indexOf(cur) + d;
    if (i >= 0 && i < list.length) location.hash = '#' + list[i].id;
  }

  /* ---------- dựng mục đang mở ---------- */
  function errorBox(msg) {
    return '<div class="app-error" role="alert">' + u.esc(msg) + '</div>';
  }

  function render() {
    var st = parseHash(), sec = st.section, list = sections();
    var content = document.getElementById('app-content');
    if (!sec) { content.innerHTML = errorBox(App.ui('err_no_sections')); return; }
    var i = list.indexOf(sec);

    document.querySelectorAll('#app-nav [data-section]').forEach(function (a) {
      a.classList.toggle('is-on', a.getAttribute('data-section') === sec.id);
    });
    document.querySelectorAll('#app-nav [data-sub]').forEach(function (a) {
      a.classList.toggle('is-on', a.getAttribute('data-parent') === sec.id && a.getAttribute('data-sub') === st.sub);
    });
    document.querySelectorAll('#app-langs button').forEach(function (b) {
      b.classList.toggle('is-on', b.getAttribute('data-lang') === App.lang());
    });
    document.getElementById('app-prev').disabled = i <= 0;
    document.getElementById('app-next').disabled = i >= list.length - 1;
    var p = App._config.project || {};
    document.getElementById('app-crumb').innerHTML =
      '<span>' + u.esc(App.t(p.name)) + '</span><span class="app-crumb-sep" aria-hidden="true">›</span><b>' + u.esc(App.t(sec.title)) + '</b>';
    document.title = App.t(sec.title) + ' – ' + App.t(p.name);

    var head = '<header class="app-page-hd">' +
      (sec.eyebrow ? '<p class="app-page-eyebrow">' + u.esc(App.t(sec.eyebrow)) + '</p>' : '') +
      '<h1>' + u.esc(App.t(sec.heading || sec.title)) + '</h1>' +
      (sec.intro ? '<p class="app-page-intro">' + u.esc(App.t(sec.intro)) + '</p>' : '') + '</header>';
    content.innerHTML = '<section class="app-page" data-section="' + u.esc(sec.id) + '" data-type="' + u.esc(sec.type) + '">' + head + '<div class="app-block"></div></section>';
    var el = content.querySelector('.app-block');

    var block = App._blocks[sec.type];
    var data = App._data[sec.data];
    if (!block) { el.innerHTML = errorBox(fill(App.ui('err_unknown_type'), { type: sec.type })); return; }
    if (data == null) { el.innerHTML = errorBox(fill(App.ui('err_missing_data'), { name: sec.data })); return; }
    var ctx = { t: App.t, ui: App.ui, lang: App.lang(), util: u, icon: App.icon, config: App._config, section: sec, sub: st.sub };
    try {
      el.innerHTML = block.render(data, ctx);
      if (block.mount) block.mount(el, data, ctx);
    } catch (err) {
      el.innerHTML = errorBox(fill(App.ui('err_block'), { msg: err && err.message, file: 'content/data/' + sec.data + '.js' }));
      if (window.console) console.error(err);
      return;
    }
    if (st.sub) {
      var target = el.querySelector('[data-anchor="' + st.sub.replace(/"/g, '') + '"]');
      if (target) target.scrollIntoView(); else window.scrollTo(0, 0);
    } else {
      window.scrollTo(0, 0);
    }
  }

  function warnMissing() {
    if (!window.console) return;
    if (App.missing.length) {
      var by = {};
      App.missing.forEach(function (m) { (by[m.lang] = by[m.lang] || []).push(m.sample); });
      console.warn('[WMS] Thiếu bản dịch:', by);
    }
    if (App.missingIcons.length) console.warn('[WMS] Icon không tồn tại:', App.missingIcons);
    if (App.check) {
      var r = App.check();
      if (r.errors.length) console.warn('[WMS] Lỗi nội dung (mở check.html để xem):', r.errors);
    }
  }

  App.start = function () {
    if (!App._config) {
      document.getElementById('app').innerHTML = errorBox('Thiếu content/config.js — chưa gọi App.config(...)');
      return;
    }
    if (App.renderCheck && /[?&]check\b/.test(location.search)) { App.renderCheck(); return; }
    App.initLang(App._config);
    shell();
    render();
    warnMissing();
    window.addEventListener('hashchange', render);
    document.addEventListener('app:lang', function () { shell(); render(); });
  };
})(window.App = window.App || {});

</script>
<script>
/* core/js/blocks/process-flow.js — khối "Sơ đồ quy trình".
 * Dữ liệu: xem chú thích đầu file content/data/processes.js.
 */
(function (App) {
  'use strict';
  var fitOn = true;

  function sysChip(s, ctx) {
    var u = ctx.util;
    if (typeof s === 'string') return '<span class="app-sys" data-sys="' + u.esc(s) + '">' + u.esc(s === 'MANUAL' ? ctx.t(ctx.manualLabel) : s) + '</span>';
    return '<span class="app-sys" data-sys="' + u.esc(s.sys || 'MANUAL') + '">' + u.esc(ctx.t(s.label)) + '</span>';
  }

  function step(st, n, ctx) {
    var u = ctx.util, t = ctx.t;
    var cls = 'pf-step' + (st.optional ? ' pf-optional' : '') + (st.wide ? ' pf-wide' : '');
    var bullets = (st.bullets || []).map(function (b) {
      return b && b.sync ? '<li class="pf-sync">' + u.esc(t(b.sync)) + '</li>' : '<li>' + u.esc(t(b)) + '</li>';
    }).join('');
    var cases = (st.cases || []).map(function (c) {
      return '<div class="pf-case" data-tag="' + u.esc(c.tag) + '"><b>' + u.esc(c.tag) + '</b> ' + u.esc(t(c.text)) +
        (c.alert ? '<span class="pf-alert">' + u.esc(t(c.alert)) + '</span>' : '') + '</div>';
    }).join('');
    return '<article class="' + cls + '"><header class="pf-step-hd"><span class="pf-num">' + n + '</span><h4>' + u.esc(t(st.title)) + '</h4></header>' +
      '<div class="pf-meta">' + ctx.icon(st.icon) + '<div class="pf-sys">' + (st.systems || []).map(function (s) { return sysChip(s, ctx); }).join('') + '</div></div>' +
      (bullets ? '<ul>' + bullets + '</ul>' : '') + cases + '</article>';
  }

  function lane(l, ctx) {
    var u = ctx.util, t = ctx.t, n = 0;
    var groups = l.groups.map(function (g, gi) {
      if ((l.numbering || 'group') === 'group') n = 0;
      var steps = g.steps.map(function (s) { n++; return step(s, n, ctx); }).join('<span class="pf-arrow" aria-hidden="true"></span>');
      var col = g.color ? 'var(--pf-' + u.esc(g.color) + ')' : 'var(--pf-c)';
      var conn = (gi > 0 && l.layout === 'row' && (g.connector || 'solid') !== 'none')
        ? '<span class="pf-arrow pf-arrow-' + u.esc(g.connector || 'solid') + '" style="--pf-a:' + col + '" aria-hidden="true"></span>' : '';
      var weight = g.steps.reduce(function (w, s) { return w + (s.wide ? 1.7 : 1); }, 0);
      return conn + '<div class="pf-group' + (g.label ? ' pf-labeled' : '') + '" style="--pf-g:' + col + ';--pf-w:' + weight + '">' +
        (g.label ? '<p class="pf-group-label">' + u.esc(t(g.label)) + '</p>' : '') + '<div class="pf-steps">' + steps + '</div></div>';
    }).join('');
    return '<section class="pf-lane" data-lane="' + u.esc(l.number) + '" style="--pf-c:var(--pf-' + u.esc(l.color) + ')">' +
      '<header class="pf-lane-hd"><span class="pf-lane-num">' + u.esc(l.number) + '</span><div><h3>' + u.esc(t(l.title)) + '</h3>' +
      (l.subtitle ? '<p>' + u.esc(t(l.subtitle)) + '</p>' : '') + '</div></header>' +
      '<div class="pf-body pf-' + (l.layout === 'row' ? 'row' : 'stack') + '">' + groups + '</div>' +
      (l.note ? '<p class="pf-note">* ' + u.esc(t(l.note)) + '</p>' : '') + '</section>';
  }

  function panels(pn, ctx) {
    if (!pn) return '';
    var u = ctx.util, t = ctx.t, out = '';
    if (pn.integration) {
      var sys = pn.integration.systems || [], links = pn.integration.links || [], row = '';
      sys.forEach(function (s, i) {
        row += '<div class="pf-sysbox" data-sys="' + u.esc(s.key) + '">' + ctx.icon(s.icon) + '<strong>' + u.esc(t(s.name)) + '</strong><span>' + u.esc(t(s.text)) + '</span></div>';
        if (links[i]) row += '<div class="pf-link"><span>' + u.esc(t(links[i].top)) + '</span><i aria-hidden="true"></i><span>' + u.esc(t(links[i].bottom)) + '</span></div>';
      });
      out += '<div class="pf-panel pf-integration"><h3>' + u.esc(t(pn.integration.title)) + '</h3><div class="pf-sysrow">' + row + '</div></div>';
    }
    if (pn.notes) {
      out += '<div class="pf-panel pf-notes"><h3>' + u.esc(t(pn.notes.title)) + '</h3><ul>' +
        pn.notes.items.map(function (x) { return '<li>' + u.esc(t(x)) + '</li>'; }).join('') + '</ul></div>';
    }
    if (pn.legend) {
      var lg = pn.legend;
      var flows = (lg.flows || []).map(function (f) {
        return '<li>' + (f.sync ? '<span class="pf-lg-sync">⇄</span>' : '<span class="pf-lg-arrow' + (f.dashed ? ' is-dashed' : '') + '" style="--pf-a:var(--pf-' + u.esc(f.color) + ')"></span>') + u.esc(t(f.text)) + '</li>';
      }).join('');
      var sw = (lg.swatches || []).map(function (s) {
        return '<li><span class="pf-lg-sw" style="--pf-a:var(--pf-' + u.esc(s.color) + ')"></span>' + u.esc(t(s.text)) + '</li>';
      }).join('');
      var chips = lg.systemsNote ? '<p class="pf-lg-sys">' + ['SAP', 'WMS', 'PDA'].map(function (s) { return sysChip(s, ctx); }).join('') + ' ' + u.esc(t(lg.systemsNote)) + '</p>' : '';
      out += '<div class="pf-panel pf-legend"><h3>' + u.esc(t(lg.title)) + '</h3><ul class="pf-lg">' + flows + sw + '</ul>' + chips + '</div>';
    }
    return '<div class="pf-panels">' + out + '</div>';
  }

  function fit(el) {
    var sheet = el.querySelector('.pf-sheet'), sc = el.querySelector('.pf-scroll'), btn = el.querySelector('#pf-fit');
    if (!sheet || !sc) return;
    sheet.style.zoom = 1;
    var z = Math.min(1, (sc.clientWidth - 2) / sheet.offsetWidth);
    sheet.style.zoom = fitOn ? z : 1;
    btn.textContent = App.ui(fitOn ? 'pf_fit_on' : 'pf_fit_off');
  }

  App.block('process-flow', {
    render: function (data, ctx) {
      var u = ctx.util, t = ctx.t;
      ctx.manualLabel = (data.panels && data.panels.legend && data.panels.legend.manualLabel) || 'Manual';
      return '<div class="pf-toolbar"><button type="button" class="app-btn" id="pf-fit"></button><span>' + u.esc(ctx.ui('pf_fit_hint')) + '</span></div>' +
        '<div class="pf-scroll"><div class="pf-sheet">' +
        (data.title ? '<header class="pf-head"><h2>' + u.esc(t(data.title)) + '</h2>' + (data.subtitle ? '<p>' + u.esc(t(data.subtitle)) + '</p>' : '') + '</header>' : '') +
        data.lanes.map(function (l) { return lane(l, ctx); }).join('') + panels(data.panels, ctx) + '</div></div>';
    },
    mount: function (el) {
      el.querySelector('#pf-fit').addEventListener('click', function () { fitOn = !fitOn; fit(el); });
      fit(el);
      if (!App._pfResize) {
        App._pfResize = true;
        window.addEventListener('resize', function () {
          var cur = document.querySelector('.app-block .pf-sheet');
          if (cur) fit(cur.closest('.app-block'));
        });
      }
    }
  });
})(window.App = window.App || {});

</script>
<script>
/* core/js/blocks/feature-list.js — khối "Danh sách tính năng".
 * Dữ liệu: { categories: [{ id, color, label, description, groups: [{ title, link?, items: [{vi,en,ko,direction?,api?}] }] }] }
 */
(function (App) {
  'use strict';
  var state = {};   // bộ lọc theo từng mục: { q, cat }
  var SECOND = { vi: 'en', en: 'vi', ko: 'en' };

  /* chữ của một tính năng ở mọi ngôn ngữ (bỏ trường direction; giữ api để tìm theo tên API) — item có thể là chuỗi thường */
  function itemText(it, u) {
    if (!it || typeof it !== 'object') return u.textAll(it);
    var copy = {};
    Object.keys(it).forEach(function (k) { if (k !== 'direction') copy[k] = it[k]; });
    return u.textAll(copy);
  }

  function count(cat) {
    return cat.groups.reduce(function (n, g) { return n + g.items.length; }, 0);
  }

  function table(data, ctx, st) {
    var u = ctx.util, t = ctx.t, ui = ctx.ui, q = u.norm(st.q), lang = ctx.lang;
    var lang2 = SECOND[lang] || 'en', no = 0, shown = 0, html = '';
    data.categories.forEach(function (cat) {
      var body = '', n = 0;
      cat.groups.forEach(function (g) {
        var gText = u.textAll(g.title);
        var rows = '';
        var hasApi = g.items.some(function (it) { return it && it.api; });
        g.items.forEach(function (it) {
          no++;
          if (st.cat !== 'all' && st.cat !== cat.id) return;
          if (q && u.norm(itemText(it, u) + ' ' + gText).indexOf(q) < 0) return;
          n++;
          rows += '<tr class="fl-row"><td class="fl-no">' + no + '</td>' +
            (hasApi ? '<td class="fl-api">' + u.highlight(it && it.api || '', q) + '</td>' : '') + '<td>' + u.highlight(t(it), q) +
            '</td><td class="fl-second">' + u.highlight(typeof it === 'object' ? (it[lang2] || '') : '', q) + '</td>' +
            (it && it.direction ? '<td class="fl-dir-cell"><span class="fl-dir" data-dir="' + u.esc(it.direction) + '">' +
              u.esc(it.direction.replace('→', ' → ')) + '</span></td>' : '') + '</tr>';
        });
        if (!rows) return;
        var hasDir = g.items.some(function (it) { return it && it.direction; });
        body += '<div class="fl-group"><h3 class="fl-group-t">' + u.esc(t(g.title)) +
          '<span class="fl-group-sub">' + u.esc(typeof g.title === 'object' ? (g.title[lang2] || '') : '') + '</span>' +
          (g.link ? '<a class="fl-link" href="#' + u.esc(g.link) + '">' + u.esc(ui('fl_see')) + '</a>' : '') + '</h3>' +
          '<table class="app-table fl-table' + (hasApi ? ' fl-has-api' : '') + '"><thead><tr><th class="fl-no">' + u.esc(ui('fl_no')) + '</th>' + (hasApi ? '<th class="fl-api">API</th>' : '') + '<th>' + u.esc(ui('fl_fn')) +
          '</th><th class="fl-second">' + u.esc(ui('fl_fn2')) + '</th>' + (hasDir ? '<th>' + u.esc(ui('fl_dir')) + '</th>' : '') +
          '</tr></thead><tbody>' + rows + '</tbody></table></div>';
      });
      if (!n) return;
      shown += n;
      html += '<section class="fl-cat" id="fl-' + u.esc(cat.id) + '" data-anchor="' + u.esc(cat.id) + '" style="--fl-c:var(--pf-' + u.esc(cat.color) + ')">' +
        '<header class="fl-cat-hd"><div><h2>' + u.esc(t(cat.label)) + '</h2><p>' + u.esc(t(cat.description)) + '</p></div>' +
        '<span class="fl-cat-n">' + n + ' ' + u.esc(ui('fl_count')) + '</span></header>' + body + '</section>';
    });
    return html + (shown ? '' : '<p class="app-empty">' + u.esc(ui('fl_none')) + '</p>');
  }

  App.block('feature-list', {
    render: function (data, ctx) {
      var u = ctx.util, t = ctx.t, ui = ctx.ui;
      var st = state[ctx.section.id] = state[ctx.section.id] || { q: '', cat: 'all' };
      if (ctx.sub) st.cat = 'all';
      var total = data.categories.reduce(function (n, c) { return n + count(c); }, 0);
      var kpis = '<div class="app-kpis"><div class="app-kpi fl-kpi"><b>' + total + '</b><span>' + u.esc(ui('fl_total')) + '</span></div>' +
        data.categories.map(function (c) {
          return '<div class="app-kpi fl-kpi" style="--fl-c:var(--pf-' + u.esc(c.color) + ')"><b>' + count(c) + '</b><span>' + u.esc(t(c.label)) + '</span></div>';
        }).join('') + '</div>';
      var chips = '<button type="button" class="app-chip fl-chip' + (st.cat === 'all' ? ' is-on' : '') + '" data-cat="all">' + u.esc(ui('all')) + '</button>' +
        data.categories.map(function (c) {
          return '<button type="button" class="app-chip fl-chip' + (st.cat === c.id ? ' is-on' : '') + '" data-cat="' + u.esc(c.id) + '">' + u.esc(t(c.label)) + '</button>';
        }).join('');
      return kpis + '<div class="app-filters"><input type="search" class="app-search fl-search" placeholder="' + u.esc(ui('fl_search')) +
        '" value="' + u.esc(st.q) + '">' + chips + '</div><div class="fl-list">' + table(data, ctx, st) + '</div>';
    },
    mount: function (el, data, ctx) {
      var st = state[ctx.section.id], list = el.querySelector('.fl-list');
      function redraw() { list.innerHTML = table(data, ctx, st); }
      el.querySelector('.fl-search').addEventListener('input', function (e) { st.q = e.target.value; redraw(); });
      el.querySelector('.app-filters').addEventListener('click', function (e) {
        var b = e.target.closest('.fl-chip'); if (!b) return;
        st.cat = b.getAttribute('data-cat');
        el.querySelectorAll('.fl-chip').forEach(function (x) { x.classList.toggle('is-on', x === b); });
        redraw();
      });
    }
  });
})(window.App = window.App || {});

</script>
<script>
/* core/js/blocks/requirement-table.js — khối "Bảng yêu cầu".
 * Bảng 4 cột: STT | Phân hệ | Chức năng | Nội dung yêu cầu nghiệp vụ (Hiện trạng / Yêu cầu).
 * Dữ liệu: { modules: [{ id, title, rows: [{ function, current: [{plant,text}], requirements: [{plant,text}] }] }] }
 */
(function (App) {
  'use strict';
  var state = {};


  function rowsHtml(data, ctx, st) {
    var u = ctx.util, t = ctx.t, ui = ctx.ui, q = u.norm(st.q);
    var plants = (ctx.config.plants || []).map(function (p) { return p.code; });
    var flat = [], no = 0;
    data.modules.forEach(function (m) {
      m.rows.forEach(function (r) {
        no++;
        if (st.mod !== 'all' && st.mod !== m.id) return;
        var text = [u.textAll(m.title), u.textAll(r['function'])].concat(
          (r.current || []).concat(r.requirements || []).map(function (b) { return u.textAll(b.text); })).join(' ');
        if (q && u.norm(text).indexOf(q) < 0) return;
        flat.push({ no: no, m: m, r: r });
      });
    });
    function list(items) {
      return '<ul>' + items.map(function (b) {
        var i = plants.indexOf(b.plant);
        return '<li>' + (i >= 0 ? '<span class="app-plant rt-plant" data-i="' + i + '">' + u.esc(b.plant) + '</span> ' : '') +
          u.highlight(t(b.text), q) + '</li>';
      }).join('') + '</ul>';
    }
    var body = flat.map(function (x, i) {
      var first = i === 0 || flat[i - 1].m !== x.m, span = 1;
      if (first) { while (flat[i + span] && flat[i + span].m === x.m) span++; }
      var r = x.r;
      return '<tr class="rt-row"><td class="rt-no">' + x.no + '</td>' +
        (first ? '<td class="rt-module" rowspan="' + span + '">' + u.esc(t(x.m.title)) + '</td>' : '') +
        '<td class="rt-fn">' + u.highlight(t(r['function']), q) + '</td><td class="rt-body">' +
        (r.current && r.current.length ? '<div class="rt-blk"><span class="rt-label rt-cur">' + u.esc(ui('rt_cur')) + '</span>' + list(r.current) + '</div>' : '') +
        (r.requirements && r.requirements.length ? '<div class="rt-blk"><span class="rt-label rt-need">' + u.esc(ui('rt_need')) + '</span>' + list(r.requirements) + '</div>' : '') +
        '</td></tr>';
    }).join('');
    if (!flat.length) return '<p class="app-empty">' + u.esc(ui('rt_none')) + '</p>';
    return '<table class="app-table rt-table"><thead><tr><th class="rt-no">' + u.esc(ui('rt_no')) + '</th><th>' + u.esc(ui('rt_module')) +
      '</th><th>' + u.esc(ui('rt_fn')) + '</th><th>' + u.esc(ui('rt_req')) + '</th></tr></thead><tbody>' + body + '</tbody></table>';
  }

  App.block('requirement-table', {
    render: function (data, ctx) {
      var u = ctx.util, t = ctx.t, ui = ctx.ui;
      var st = state[ctx.section.id] = state[ctx.section.id] || { q: '', mod: 'all' };
      var chips = '<button type="button" class="app-chip rt-chip' + (st.mod === 'all' ? ' is-on' : '') + '" data-mod="all">' + u.esc(ui('rt_all')) + '</button>' +
        data.modules.map(function (m) {
          return '<button type="button" class="app-chip rt-chip' + (st.mod === m.id ? ' is-on' : '') + '" data-mod="' + u.esc(m.id) + '">' + u.esc(t(m.title)) + '</button>';
        }).join('');
      return '<div class="app-filters"><input type="search" class="app-search rt-search" placeholder="' + u.esc(ui('rt_search')) +
        '" value="' + u.esc(st.q) + '">' + chips + '</div><div class="rt-wrap">' + rowsHtml(data, ctx, st) + '</div>';
    },
    mount: function (el, data, ctx) {
      var st = state[ctx.section.id], wrap = el.querySelector('.rt-wrap');
      function redraw() { wrap.innerHTML = rowsHtml(data, ctx, st); }
      el.querySelector('.rt-search').addEventListener('input', function (e) { st.q = e.target.value; redraw(); });
      el.querySelector('.app-filters').addEventListener('click', function (e) {
        var b = e.target.closest('.rt-chip'); if (!b) return;
        st.mod = b.getAttribute('data-mod');
        el.querySelectorAll('.rt-chip').forEach(function (x) { x.classList.toggle('is-on', x === b); });
        redraw();
      });
    }
  });
})(window.App = window.App || {});

</script>
<script>
/* core/js/blocks/guide.js — khối "Hướng dẫn màn hình" / "Chi tiết giải pháp".
 * Dữ liệu:
 *   { groups: [{ id, title, intro?, screens: [...] }] }      // có nhóm (vd 4.1 Master data)
 *   hoặc { screens: [...] }                                 // không nhóm
 * Một màn hình: { id, title, image?, wide?, purpose?, stepsTitle?, steps: [text], notes?: [text] }
 *   image: đường dẫn tính từ index.html, ví dụ 'content/assets/nhap-kho.png'
 *   wide: true → ảnh rộng toàn khung, phần diễn giải nằm dưới ảnh (hợp với ảnh chụp màn hình ngang)
 */
(function (App) {
  'use strict';

  function screen(s, ctx) {
    var u = ctx.util, t = ctx.t, ui = ctx.ui;
    var img = s.image
      ? '<figure class="gd-fig"><img class="gd-img" src="' + u.esc(s.image) + '" alt="' + u.esc(t(s.title)) + '" data-src="' + u.esc(s.image) + '"></figure>'
      : '';
    return '<section class="gd-screen' + (s.wide ? ' gd-wide' : '') + '" id="gd-' + u.esc(s.id) + '" data-anchor="' + u.esc(s.id) + '">' +
      '<div class="gd-text"><h3>' + u.esc(t(s.title)) + '</h3>' +

        : '') +
      (s.notes && s.notes.length ? '<div class="gd-notes"><b>' + u.esc(ui('gd_notes')) + '</b><ul>' +
        s.notes.map(function (x) { return '<li>' + u.esc(t(x)) + '</li>'; }).join('') + '</ul></div>' : '') +
      '</div>' + img + '</section>';
  }

  App.block('guide', {
    render: function (data, ctx) {
      var u = ctx.util, t = ctx.t;
      var groups = data.groups || [{ screens: data.screens || [] }];
      return '<div class="gd-list">' + groups.map(function (g) {
        var inner = (g.screens || []).map(function (s) { return screen(s, ctx); }).join('');
        if (!g.title) return inner;
        return '<section class="gd-group" id="gd-g-' + u.esc(g.id) + '" data-anchor="' + u.esc(g.id) + '">' +
          '<h2>' + u.esc(t(g.title)) + '</h2>' + (g.intro ? '<p class="gd-group-intro">' + u.esc(t(g.intro)) + '</p>' : '') + inner + '</section>';
      }).join('') + '</div>';
    },
    mount: function (el, data, ctx) {
      el.querySelectorAll('img.gd-img').forEach(function (img) {
        function broken() {
          var box = document.createElement('div');
          box.className = 'gd-noimg';
          box.textContent = ctx.ui('gd_noimg').replace('{path}', img.getAttribute('data-src'));
          img.replaceWith(box);
        }
        if (img.complete && img.naturalWidth === 0) broken(); else img.addEventListener('error', broken);
      });
    }
  });
})(window.App = window.App || {});

<script>
/* core/js/check.js — trang tự kiểm tra nội dung (mở check.html hoặc index.html?check).
 * App.check() → { errors: [...], warnings: [...] }   mỗi mục: { kind, where, detail }
 * Ảnh được kiểm tra bất đồng bộ; kết quả nằm trong App._checkImages.
 */
(function (App) {
  'use strict';
  App._checkImages = [];

  function langs() { return ((App._config && App._config.languages) || [{ code: 'vi' }]).map(function (l) { return l.code; }); }

  function isText(o, codes) {
    if (!o || typeof o !== 'object' || Array.isArray(o)) return false;
    var keys = Object.keys(o);
    return keys.length > 0 && o.vi != null && keys.every(function (k) { return codes.indexOf(k) >= 0; });
  }

  function walk(o, path, fn) {
    fn(o, path);
    if (o && typeof o === 'object') {
      Object.keys(o).forEach(function (k) { walk(o[k], path + (Array.isArray(o) ? '[' + k + ']' : '.' + k), fn); });
    }
  }

  App.check = function () {
    var errors = [], warnings = [], cfg = App._config || {}, codes = langs();
    var secs = cfg.sections || [], seen = {};
    secs.forEach(function (s, i) {
      var where = 'config.sections[' + i + '] (' + s.id + ')';
      if (seen[s.id]) errors.push({ kind: 'duplicate-id', where: where, detail: s.id });
      seen[s.id] = true;
      if (!App._blocks[s.type]) errors.push({ kind: 'unknown-type', where: where, detail: s.type });
      if (App._data[s.data] == null) errors.push({ kind: 'missing-data', where: where, detail: s.data });
    });
    var icons = App.iconNames || [];
    function scan(obj, root) {
      var ids = {};
      walk(obj, root, function (v, path) {
        if (isText(v, codes)) {
          codes.forEach(function (c) {
            if (v[c] == null || v[c] === '') warnings.push({ kind: 'missing-translation', where: path, detail: c + ': ' + v.vi });
          });
        }
        if (v && typeof v === 'object' && !Array.isArray(v)) {
          if (typeof v.icon === 'string' && icons.indexOf(v.icon) < 0) errors.push({ kind: 'missing-icon', where: path, detail: v.icon });
          if (typeof v.id === 'string' && /\.(lanes|screens|categories|modules|groups)\[\d+\]$/.test(path)) {
            var key = path.replace(/\[\d+\]$/, '') + ':' + v.id;
            if (ids[key]) errors.push({ kind: 'duplicate-id', where: path, detail: v.id });
            ids[key] = true;
          }
        }
      });
    }
    scan(cfg, 'config');
    Object.keys(App._data).forEach(function (name) { scan(App._data[name], name); });

    /* cấu trúc dữ liệu theo từng loại khối (lỗi hay gặp khi sửa tay: gõ sai tên trường, chuỗi thay cho danh sách) */
    function arr(v, path, req) {
      if (v == null && !req) return [];
      if (!Array.isArray(v)) { errors.push({ kind: 'bad-structure', where: path, detail: App.ui('ck_need_list') }); return []; }
      return v;
    }
    var SCHEMA = {
      'feature-list': function (d, n) {
        arr(d.categories, n + '.categories', true).forEach(function (c, i) {
          var pc = n + '.categories[' + i + ']';
          arr(c.groups, pc + '.groups', true).forEach(function (g, j) {
            arr(g.items, pc + '.groups[' + j + '].items', true).forEach(function (it, k) {
              if (it && it.direction != null && typeof it.direction !== 'string')
                errors.push({ kind: 'bad-structure', where: pc + '.groups[' + j + '].items[' + k + '].direction', detail: 'SAP→WMS / WMS→SAP' });
            });
          });
        });
      },
      'process-flow': function (d, n) {
        arr(d.lanes, n + '.lanes', true).forEach(function (l, i) {
          var pl = n + '.lanes[' + i + ']';
          arr(l.groups, pl + '.groups', true).forEach(function (g, j) {
            arr(g.steps, pl + '.groups[' + j + '].steps', true).forEach(function (st, k) {
              var ps = pl + '.groups[' + j + '].steps[' + k + ']';
              arr(st.bullets, ps + '.bullets', false); arr(st.cases, ps + '.cases', false); arr(st.systems, ps + '.systems', false);
            });
          });
        });
      },
      'requirement-table': function (d, n) {
        arr(d.modules, n + '.modules', true).forEach(function (m, i) {
          arr(m.rows, n + '.modules[' + i + '].rows', true).forEach(function (r, j) {
            var pr = n + '.modules[' + i + '].rows[' + j + ']';
            arr(r.current, pr + '.current', false); arr(r.requirements, pr + '.requirements', false);
          });
        });
      },
      'guide': function (d, n) {
        function screens(list, p) {
          arr(list, p, true).forEach(function (sc, i) {
            arr(sc.steps, p + '[' + i + '].steps', false); arr(sc.notes, p + '[' + i + '].notes', false);
          });
        }
        if (d.groups != null) arr(d.groups, n + '.groups', true).forEach(function (g, i) { screens(g.screens, n + '.groups[' + i + '].screens'); });
        else screens(d.screens, n + '.screens');
      }
    };
    var checked = {};
    secs.forEach(function (s) {
      var d = App._data[s.data];
      if (d && SCHEMA[s.type] && !checked[s.data]) { checked[s.data] = true; SCHEMA[s.type](d, s.data); }
    });

    /* màu (khoá --pf-<màu> trong tokens.css / theme.css) và mã nhà máy */
    var css = window.getComputedStyle(document.documentElement);
    var plants = (cfg.plants || []).map(function (p) { return p.code; });
    Object.keys(App._data).forEach(function (name) {
      walk(App._data[name], name, function (v, path) {
        if (!v || typeof v !== 'object' || Array.isArray(v)) return;
        if (typeof v.color === 'string' && !css.getPropertyValue('--pf-' + v.color).trim())
          errors.push({ kind: 'unknown-color', where: path, detail: v.color });
        if (typeof v.plant === 'string' && v.plant && plants.indexOf(v.plant) < 0)
          errors.push({ kind: 'unknown-plant', where: path, detail: v.plant });
      });
    });
    return { errors: errors, warnings: warnings };
  };

  function probeImages(done) {
    var list = [];
    Object.keys(App._data).forEach(function (name) {
      walk(App._data[name], name, function (v, path) {
        if (v && typeof v === 'object' && typeof v.image === 'string') list.push({ path: path, src: v.image });
      });
    });
    var left = list.length;
    App._checkImages = [];
    if (!left) return done();
    list.forEach(function (x) {
      var img = new Image();
      img.onload = function () { if (--left === 0) done(); };
      img.onerror = function () {
        App._checkImages.push({ kind: 'missing-image', where: x.path, detail: x.src });
        if (--left === 0) done();
      };
      img.src = x.src;
    });
  }

  App.renderCheck = function () {
    var u = App.util;
    if (App._config) App.initLang(App._config);
    var root = document.getElementById('app');
    root.innerHTML = '<main class="ck"><h1>' + u.esc(App.ui('ck_title')) + '</h1><p id="check-summary" class="ck-summary"></p><div id="check-list"></div></main>';
    probeImages(function () {
      var r = App.check(), errs = r.errors.concat(App._checkImages), warns = r.warnings;
      var sum = document.getElementById('check-summary');
      sum.textContent = App.ui('ck_summary').replace('{e}', errs.length).replace('{w}', warns.length);
      sum.className = 'ck-summary ' + (errs.length ? 'is-bad' : 'is-ok');
      function rows(list, cls) {
        return list.map(function (x) {
          return '<tr class="' + cls + '"><td>' + u.esc(App.ui('ck_' + x.kind.replace(/-/g, '_'))) + '</td><td><code>' + u.esc(x.where) + '</code></td><td>' + u.esc(x.detail) + '</td></tr>';
        }).join('');
      }
      document.getElementById('check-list').innerHTML = (errs.length || warns.length)
        ? '<table class="app-table"><thead><tr><th>' + u.esc(App.ui('ck_kind')) + '</th><th>' + u.esc(App.ui('ck_where')) + '</th><th>' + u.esc(App.ui('ck_detail')) + '</th></tr></thead><tbody>' +
          rows(errs, 'ck-err') + rows(warns, 'ck-warn') + '</tbody></table>'
        : '<p class="app-empty">' + u.esc(App.ui('ck_ok')) + '</p>';
      sum.setAttribute('data-done', '1');
    });
  };
})(window.App = window.App || {});

</script>
