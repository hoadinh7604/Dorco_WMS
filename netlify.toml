# Trang tĩnh: không có bước build, xuất bản thư mục gốc.
[build]
  publish = "."

# Không cho truy cập công cụ kiểm thử và tài liệu thiết kế trên Netlify.
[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true
